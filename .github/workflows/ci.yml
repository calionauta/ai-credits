name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build
        run: go build ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v7 installs golangci-lint v2.x (built with a recent Go). The old
          # v6 action pinned v1.64.8 (built with go1.24) which errors on our
          # go 1.26 directive: "language version used to build golangci-lint
          # is lower than the targeted Go version". v2.12.2 matches local.
          version: v2.12.2
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...